# What the sky asks. Each question rides on a find (`on`) and belongs to a
# thread: people (who is there for you), plans (something to look forward
# to), or perspective. The feeling behind a question is never named in it.
#
# on:      what has to be caught for the question to come up
#            pole, pole-south   Polaris, or the Southern Cross in the south
#            moons, rings, mars, venus, moon, meteor, cluster, galaxy,
#            andromeda, nebula, double, distant (a named star), orion (Betelgeuse or
#            Rigel), reveal (after a drawing turns out to be a constellation),
#            any (whatever is caught)
#            person             someone already named on earlier nights
#            plan-moon, plan-shower, plan-opposition, plan-pairing,
#            plan-season        a real sky event ahead
# answer:  name (a person), text, or plan
# ask:     for plans, whether the answer is "what" to do or "who" with
# needs:   "weights" if it only makes sense when weights were set down tonight
#
# Placeholders: {name} {event} {day} {planet} {gap}

[[question]]
id = "pole-3am"
thread = "people"
on = "pole"
answer = "name"
text = "The whole sky turns around this star, and hardly anyone notices it's the one that stays put. Who would pick up if you rang at 3am?"

[[question]]
id = "pole-steer"
thread = "people"
on = "pole"
answer = "name"
text = "Sailors steered by this star because it never moves. Who do you steer by, without really thinking about it?"

[[question]]
id = "pole-south-3am"
thread = "people"
on = "pole-south"
answer = "name"
text = "The Southern Cross points to an empty place that the whole sky turns around, and hardly anyone notices it. Who would pick up if you rang at 3am?"

[[question]]
id = "moons-running"
thread = "people"
on = "moons"
answer = "name"
text = "Four moons circle Jupiter all night, pulled along without being asked. Who keeps things running around you without being asked?"

[[question]]
id = "rings-together"
thread = "people"
on = "rings"
answer = "name"
text = "Saturn's rings are countless small pieces, held together by something you can't see. Who holds things together without anyone noticing?"

[[question]]
id = "double-seeing"
thread = "people"
on = "double"
answer = "name"
text = "Two stars that look like one until you really look. Who have you known so long you've stopped seeing them properly?"

[[question]]
id = "venus-taught"
thread = "people"
on = "venus"
answer = "name"
text = "Often the first light out in the evening, or the last to fade at dawn. Who taught you something you still use every day?"

[[question]]
id = "cluster-laughed"
