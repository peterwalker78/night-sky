# A true line about the constellations worth finding by their shape. Only
# these become finds; the abbreviation matches constellations.txt.

[[note]]
abbrev = "Ori"
fact = "The hunter. His belt is three stars in a row; red Betelgeuse is his shoulder and blue-white Rigel his foot."

[[note]]
abbrev = "UMa"
fact = "Its seven brightest stars make the Plough, or Big Dipper. The two at the end of the bowl point to Polaris."

[[note]]
abbrev = "UMi"
fact = "The Little Dipper. Polaris, the star the whole northern sky turns around, is the end of its handle."

[[note]]
abbrev = "Cas"
fact = "A queen in Greek myth, drawn as a W. It sits across Polaris from the Plough, so one is always easy when the other is low."

[[note]]
abbrev = "Cyg"
fact = "The swan, also called the Northern Cross, flying along the Milky Way. Deneb at its tail is one of the most luminous stars the eye can see."

[[note]]
abbrev = "Lyr"
fact = "A small lyre around Vega, one of the three corners of the Summer Triangle. Vega was the pole star about fourteen thousand years ago."

[[note]]
abbrev = "Aql"
fact = "The eagle. Its brightest star, Altair, spins so fast that it bulges at the middle."

[[note]]
abbrev = "Sco"
fact = "The scorpion, with red Antares at its heart. The name Antares means rival of Mars."

[[note]]
abbrev = "Sgr"
fact = "Its brightest stars make a teapot, and the spout points towards the centre of our galaxy."

[[note]]
abbrev = "Leo"
fact = "The lion. A backwards question mark, the Sickle, makes its head, with Regulus at the bottom."

[[note]]
abbrev = "Tau"
fact = "The bull. Orange Aldebaran marks its eye, and the Pleiades ride on its shoulder."

[[note]]
abbrev = "Gem"
fact = "The twins, Castor and Pollux. Castor turns out to be six stars, not one."

[[note]]
abbrev = "Peg"
fact = "The winged horse. Its body is the Great Square, and one corner of the square belongs to Andromeda."

[[note]]
abbrev = "And"
fact = "The chained princess. Within her lies the Andromeda Galaxy, the farthest thing the eye can see without help."

[[note]]
abbrev = "Per"
fact = "The hero who rescued Andromeda. The Perseids fly out of it every August, and its star Algol dims every few days."

[[note]]
abbrev = "Aur"
fact = "The charioteer, a pentagon of stars led by Capella, the sixth-brightest star in the night sky."

[[note]]
abbrev = "Boo"
fact = "The herdsman. Follow the arc of the Plough's handle and you reach Arcturus, the brightest star in the northern half of the sky."

[[note]]
abbrev = "CMa"
fact = "The great dog, with Sirius, the brightest star in the night sky, just 8.6 light years away."

[[note]]
abbrev = "CMi"
fact = "The little dog: hardly more than Procyon and one companion star."

[[note]]
abbrev = "Vir"
fact = "The largest constellation of the zodiac, with blue-white Spica as its brightest star."

[[note]]
abbrev = "CrB"
fact = "The northern crown: a small semicircle of stars, easy to pick out once seen."

[[note]]
abbrev = "Her"
fact = "The strongman, upside down in our sky. Four stars in his middle make the Keystone."

[[note]]
abbrev = "Dra"
fact = "The dragon winds between the two bears. One of its stars, Thuban, was the pole star when the pyramids were built."

[[note]]
abbrev = "Cru"
fact = "The Southern Cross, the smallest of the 88 constellations and the best-known sight of the southern sky."

[[note]]
abbrev = "Cen"
fact = "The centaur. It holds Alpha Centauri, the nearest star system to the Sun, and Omega Centauri, the galaxy's largest globular cluster."

[[note]]
abbrev = "Car"
fact = "The keel of a great ship. Canopus, the second-brightest star in the night sky, is here."

[[note]]
abbrev = "Psc"
fact = "The fishes. The Sun stands in Pisces at the March equinox, the point astronomers measure the whole sky from."

[[note]]
abbrev = "Aqr"
fact = "The water-bearer, pouring a stream of faint stars down towards Fomalhaut."

[[note]]
abbrev = "Ari"
fact = "The ram: a short bent line of three stars beside Pisces and Taurus."

[[note]]
abbrev = "Cap"
fact = "The sea goat, a wide triangle of fairly faint stars and one of the oldest constellations on record."

[[note]]
abbrev = "Cnc"
fact = "The crab, faint but holding the Beehive cluster at its middle."
