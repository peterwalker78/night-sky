# A true line about the constellations worth finding by their shape. Only
# these become finds; the abbreviation matches constellations.txt.

[[note]]
abbrev = "Ori"
fact = "The hunter. His belt is three stars in a row; red Betelgeuse is his shoulder and blue-white Rigel his foot."
more = ["The Orion Nebula hangs below the belt as the middle 'star' of his sword.", "It is the radiant of the Orionids, the strongest meteor shower from Halley's Comet."]

[[note]]
abbrev = "UMa"
fact = "Its seven brightest stars make the Plough, or Big Dipper. The two at the end of the bowl point to Polaris."
more = ["Stories of an animal hunted into the sky, which may lie behind the Great Bear, could go back more than 13,000 years.", "The Plough appears on the flag of Alaska."]

[[note]]
abbrev = "UMi"
fact = "The Little Dipper. Polaris, the star the whole northern sky turns around, is the end of its handle."
more = ["Thales is said to have measured 'the Wagon by which the Phoenicians sail'; the Greeks called it the Phoenician Bear.", "Two of its stars, Kochab and Pherkad, are called the Guardians of the Pole."]

[[note]]
abbrev = "Cas"
fact = "A queen in Greek myth, drawn as a W. It sits across Polaris from the Plough, so one is always easy when the other is low."
more = ["Tycho Brahe's supernova flared here in 1572.", "As punishment for her boasting she wheels around the pole on her throne, clinging on for half the time so as not to fall."]

[[note]]
abbrev = "Cyg"
fact = "The swan, also called the Northern Cross, flying along the Milky Way. Deneb at its tail is one of the most luminous stars the eye can see."
more = ["In one Greek story it is Orpheus, turned into a swan after his death and set beside his lyre.", "Cygnus X-1, near eta Cygni, was the first object widely held to be a black hole."]

[[note]]
abbrev = "Lyr"
fact = "A small lyre around Vega, one of the three corners of the Summer Triangle. Vega was the pole star about fourteen thousand years ago."
more = ["The lyre of Orpheus, whose music charmed even Hades into letting his wife Eurydice go.", "Beta Lyrae is two stars so close that each is pulled into an egg shape, with gas flowing between them."]

[[note]]
abbrev = "Aql"
fact = "The eagle. Its brightest star, Altair, spins so fast that it bulges at the middle."
more = ["In Greek myth, the eagle that carried Zeus's thunderbolts and snatched the shepherd boy Ganymede up to Olympus.", "In the Chinese love story of Qi Xi, Altair is Niu Lang, parted forever from his wife Zhi Nu, the star Vega, by the river of the Milky Way."]

[[note]]
abbrev = "Sco"
fact = "The scorpion, with red Antares at its heart. The name Antares means rival of Mars."
more = ["In one Greek myth the scorpion was sent to kill boastful Orion; now Orion hunts in winter and flees each summer when the scorpion comes.", "The two stars at the tip of its tail, Shaula and Lesath, both have names meaning 'sting'."]

[[note]]
abbrev = "Sgr"
fact = "Its brightest stars make a teapot, and the spout points towards the centre of our galaxy."
more = ["The Babylonians saw it as the god Nergal, a winged, two-headed archer, half man and half beast.", "Its star Nunki may carry the oldest star name still in use, after the Babylonian city of Eridu."]

[[note]]
abbrev = "Leo"
fact = "The lion. A backwards question mark, the Sickle, makes its head, with Regulus at the bottom."
more = ["The Nemean Lion, killed by Heracles in the first of his twelve labours.", "Mesopotamians may have seen a lion in these stars as early as 4000 BC."]

[[note]]
abbrev = "Tau"
fact = "The bull. Orange Aldebaran marks its eye, and the Pleiades ride on its shoulder."
more = ["Aldebaran's name is Arabic for 'the follower', probably because it follows the Pleiades across the sky.", "From about 4000 to 1700 BC the Sun stood in Taurus at the spring equinox."]

[[note]]
abbrev = "Gem"
fact = "The twins, Castor and Pollux. Castor turns out to be six stars, not one."
more = ["In Greek myth Castor was mortal and Pollux the son of Zeus; when Castor died, Zeus joined the twins together in the sky.", "Pollux is really the brighter of the two, though Bayer labelled Castor 'alpha'."]

[[note]]
abbrev = "Peg"
fact = "The winged horse. Its body is the Great Square, and one corner of the square belongs to Andromeda."
more = ["51 Pegasi, just over 50 light years away, was the first Sun-like star found to have a planet.", "Pegasus sprang from Medusa when Perseus cut off her head, and his hooves dug out Hippocrene, a spring that gave poets their gift."]

[[note]]
abbrev = "And"
fact = "The chained princess. Within her lies the Andromeda Galaxy, the farthest thing the eye can see without help."
more = ["One of the largest constellations, over 1,400 times the size of the full Moon.", "Her mother's boast offended the sea nymphs, and Andromeda was chained to a rock as prey for the monster Cetus."]

[[note]]
abbrev = "Per"
fact = "The hero who rescued Andromeda. The Perseids fly out of it every August, and its star Algol dims every few days."
more = ["Algol's name means 'the demon's head': it marks the head of Medusa, which Perseus carries.", "In 1901 a nova, GK Persei, blazed up here to magnitude 0.2."]

[[note]]
abbrev = "Aur"
fact = "The charioteer, a pentagon of stars led by Capella, the sixth-brightest star in the night sky."
more = ["In Greek myth he is often Erichthonius of Athens, said to have invented the four-horse chariot.", "Capella is the Goat Star, standing for the she-goat Amalthea of Greek myth."]

[[note]]
abbrev = "Boo"
fact = "The herdsman. Follow the arc of the Plough's handle and you reach Arcturus, the brightest star in the northern half of the sky."
more = ["Homer's Odyssey names it as a guide for sailors, 'late-setting' in the sky.", "Arcturus takes its name from the Greek for 'bear-keeper'."]

[[note]]
abbrev = "CMa"
fact = "The great dog, with Sirius, the brightest star in the night sky, just 8.6 light years away."
more = ["The Babylonians saw Sirius as an arrow aimed at Orion, fired from a bow made of the stars to its south.", "It holds VY Canis Majoris, one of the largest stars known."]

[[note]]
abbrev = "CMi"
fact = "The little dog: hardly more than Procyon and one companion star."
more = ["Procyon means 'before the dog': it rises about an hour ahead of Sirius.", "Around 1100 BC, Babylonian tablets called Procyon and Gomeisa 'the twins'."]

[[note]]
abbrev = "Vir"
fact = "The largest constellation of the zodiac, with blue-white Spica as its brightest star."
more = ["It holds the Virgo Cluster of galaxies, among them the giant M87.", "The Greeks saw Astraea, goddess of justice, who fled to the sky when the Silver Age ended."]

[[note]]
abbrev = "CrB"
fact = "The northern crown: a small semicircle of stars, easy to pick out once seen."
more = ["In Greek myth, the crown that Dionysus gave to Ariadne, which she set among the stars.", "T Coronae Borealis, the Blaze Star, is a recurrent nova; it last flared up to magnitude 2 in 1946."]

[[note]]
abbrev = "Her"
fact = "The strongman, upside down in our sky. Four stars in his middle make the Keystone."
more = ["The fifth-largest constellation, yet it has no star brighter than magnitude 2.5.", "Its star Rasalgethi takes its name from 'the kneeler's head'."]

[[note]]
abbrev = "Dra"
fact = "The dragon winds between the two bears. One of its stars, Thuban, was the pole star when the pyramids were built."
more = ["In one Greek myth Athena hurled the dragon into the sky, where it froze, still twisted, at the cold north pole.", "In 1728 James Bradley discovered the aberration of starlight by watching its brightest star, gamma Draconis."]

[[note]]
abbrev = "Cru"
fact = "The Southern Cross, the smallest of the 88 constellations and the best-known sight of the southern sky."
more = ["In the fourth millennium BC it could be seen whole from as far north as Britain; the slow wobble of Earth's axis has since hidden it from Europe.", "It holds four Cepheid variables, each visible to the naked eye at its brightest."]

[[note]]
abbrev = "Cen"
fact = "The centaur. It holds Alpha Centauri, the nearest star system to the Sun, and Omega Centauri, the galaxy's largest globular cluster."
more = ["Its alpha and beta stars are the southern pointers, leading the eye to the Southern Cross.", "It has 281 stars visible to the naked eye, more than any other constellation."]

[[note]]
abbrev = "Car"
fact = "The keel of a great ship. Canopus, the second-brightest star in the night sky, is here."
more = ["It was once part of Argo Navis, the ship of Jason and the Argonauts, until Lacaille divided the ship in three in 1763.", "Canopus is named after the navigator of Menelaus, king of Sparta."]

[[note]]
abbrev = "Psc"
fact = "The fishes. The Sun stands in Pisces at the March equinox, the point astronomers measure the whole sky from."
more = ["The Greeks and Romans pictured two fishes, each tied by a cord, the cords meeting at a knot.", "Its alpha star, Alrescha, is named 'the cord'."]

[[note]]
abbrev = "Aqr"
fact = "The water-bearer, pouring a stream of faint stars down towards Fomalhaut."
more = ["The Babylonians saw the god Ea here, holding an overflowing vase.", "In ancient Egypt the Nile was said to flood when Aquarius dipped his jar into the river."]

[[note]]
abbrev = "Ari"
fact = "The ram: a short bent line of three stars beside Pisces and Taurus."
more = ["Before late Babylonian times its stars were not a ram but a farmhand, 'the Hired Man'.", "Its brightest star, Hamal, takes its name from the Arabic for 'lamb' or 'head of the ram'."]

[[note]]
abbrev = "Cap"
fact = "The sea goat, a wide triangle of fairly faint stars and one of the oldest constellations on record."
more = ["The Sun stood here at the December solstice until about 130 BC; the Tropic of Capricorn still bears its name.", "In one Greek myth it is Amalthea, the goat that fed the infant Zeus; her broken horn became the horn of plenty."]

[[note]]
abbrev = "Cnc"
fact = "The crab, faint but holding the Beehive cluster at its middle."
more = ["Its star 55 Cancri has five known planets.", "The dimmest constellation of the zodiac, once described as 'black and without eyes'."]
