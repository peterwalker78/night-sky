<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c2e"/>
      <stop offset="0.72" stop-color="#0b0e1b"/>
      <stop offset="1" stop-color="#2b231f"/>
    </linearGradient>
    <pattern id="lattice" width="7" height="7" patternUnits="userSpaceOnUse" x="1" y="1">
      <circle cx="3.5" cy="3.5" r="1" fill="#c9d4ff" fill-opacity="0.16"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f0c36b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f0c36b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="112" height="112" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="112" height="112" fill="url(#sky)"/>
    <rect x="8" y="8" width="112" height="112" fill="url(#lattice)"/>
    <!-- The star's way across the sky, west and down. -->
    <path d="M 104 24 Q 72 30 40 82" fill="none" stroke="#f3ecd9" stroke-opacity="0.4" stroke-width="2.2" stroke-dasharray="0.1 7.5" stroke-linecap="round"/>
    <circle cx="40" cy="84" r="18" fill="url(#glow)"/>
    <circle cx="40" cy="84" r="4.8" fill="#fbe8c2"/>
    <!-- The moss along the horizon. -->
    <path d="M 0 128 L 0 100 C 34 90 94 90 128 100 L 128 128 Z" fill="#6f8f4d"/>
    <path d="M 30 96 C 30 92 38 92 38 96 M 56 93 C 56 89 64 89 64 93 M 82 94 C 82 90 90 90 90 94" fill="#86a65c"/>
  </g>
</svg>
